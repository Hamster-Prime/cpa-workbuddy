name: Release artifacts
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          set-safe-directory: false
      - uses: ./.github/actions/toolchain
      - name: Version and full native quality gate
        run: go run ./cmd/project quality
      - name: Package allowlisted library artifact
        run: go run ./cmd/project package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cpa-workbuddy-${{ matrix.os }}-${{ github.ref_name }}
          path: |
            out/dist/*.zip
            out/dist/*.sha256
          if-no-files-found: error
  release-required:
    if: always()
    needs: [package]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every native package job
        env:
          RESULT: ${{ needs.package.result }}
        run: test "$RESULT" = success
