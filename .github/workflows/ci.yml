name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          set-safe-directory: false
      - uses: ./.github/actions/toolchain
      - name: Native source and event gate
        run: go run ./cmd/project quality --github-event
  quality-required:
    if: always()
    needs: [quality]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every native job
        env:
          RESULT: ${{ needs.quality.result }}
        run: test "$RESULT" = success
