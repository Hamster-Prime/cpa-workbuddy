name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: windows/amd64
            artifact: windows-amd64
          - os: ubuntu-24.04
            target: linux/amd64
            artifact: linux-amd64
          - os: ubuntu-24.04-arm
            target: linux/arm64
            artifact: linux-arm64
          - os: macos-15-intel
            target: darwin/amd64
            artifact: darwin-amd64
          - os: macos-15
            target: darwin/arm64
            artifact: darwin-arm64
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          set-safe-directory: false
      - uses: ./.github/actions/toolchain
      - name: Verify native target
        shell: bash
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: test "$(go env GOOS)/$(go env GOARCH)" = "$EXPECTED_TARGET"
      - name: Version and full native quality gate
        run: go run ./cmd/project quality
      - name: Package allowlisted library artifact
        run: go run ./cmd/project package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cpa-workbuddy-${{ matrix.artifact }}
          path: |
            out/dist/*.zip
            out/dist/*.sha256
          if-no-files-found: error
          retention-days: 7
          overwrite: true
  publish:
    needs: [package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          set-safe-directory: false
      - name: Validate version, tag, and release notes
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          test -n "$version"
          test "$TAG" = "v$version" || { echo "tag $TAG must equal v$version" >&2; exit 1; }
          test -s docs/release-notes.md || { echo "docs/release-notes.md is missing or empty" >&2; exit 1; }
          notes_title="$(head -n 1 docs/release-notes.md | tr -d '\r')"
          test "$notes_title" = "# $TAG" || { echo "docs/release-notes.md must start with '# $TAG'" >&2; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cpa-workbuddy-*
          path: artifacts
          merge-multiple: true
      - name: Verify exact artifact set and checksums
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          targets=(windows-amd64 linux-amd64 linux-arm64 darwin-amd64 darwin-arm64)
          expected=""
          for target in "${targets[@]}"; do
            base="cpa-workbuddy-v${version}-${target}.zip"
            expected="${expected}${base}"$'\n'
            expected="${expected}${base}.sha256"$'\n'
          done
          if find artifacts -mindepth 1 -maxdepth 1 -type d | grep -q .; then
            echo "unexpected directories in downloaded artifacts" >&2
            exit 1
          fi
          actual="$(find artifacts -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort)"
          if test "$actual" != "$(printf '%s' "$expected" | sort)"; then
            echo "downloaded artifacts do not match the five expected targets" >&2
            printf 'expected:\n%s\nactual:\n%s\n' "$(printf '%s' "$expected" | sort)" "$actual" >&2
            exit 1
          fi
          for target in "${targets[@]}"; do
            (cd artifacts && sha256sum --check --strict "cpa-workbuddy-v${version}-${target}.zip.sha256")
          done
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          assets=()
          for target in windows-amd64 linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            base="cpa-workbuddy-v${version}-${target}.zip"
            assets+=("artifacts/$base" "artifacts/$base.sha256")
          done
          gh release create "$TAG" \
            --repo "$REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --notes-file docs/release-notes.md \
            "${assets[@]}"
