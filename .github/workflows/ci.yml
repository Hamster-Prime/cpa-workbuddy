name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: windows/amd64
          - os: ubuntu-24.04
            target: linux/amd64
          - os: ubuntu-24.04-arm
            target: linux/arm64
          - os: macos-15-intel
            target: darwin/amd64
          - os: macos-15
            target: darwin/arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          set-safe-directory: false
      - uses: ./.github/actions/toolchain
      - name: Verify native target
        shell: bash
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: test "$(go env GOOS)/$(go env GOARCH)" = "$EXPECTED_TARGET"
      - name: Native source and event gate
        if: github.event_name != 'workflow_dispatch'
        run: >-
          go run ./cmd/project quality --github-event
          --stage tools --stage version --stage format --stage modules
          --stage vet --stage lsp --stage lint --stage test
      - name: Native source gate
        if: github.event_name == 'workflow_dispatch'
        run: >-
          go run ./cmd/project quality
          --stage tools --stage version --stage format --stage modules
          --stage vet --stage lsp --stage lint --stage test
  quality-required:
    if: always()
    needs: [quality]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every native job
        env:
          RESULT: ${{ needs.quality.result }}
        run: test "$RESULT" = success
