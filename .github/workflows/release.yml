name: Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  lint-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: windows/amd64
          - os: ubuntu-24.04
            target: linux/amd64
          - os: ubuntu-24.04-arm
            target: linux/arm64
          - os: macos-15-intel
            target: darwin/amd64
          - os: macos-15
            target: darwin/arm64
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
          set-safe-directory: false
      - uses: ./.github/actions/toolchain
      - name: Verify native target
        shell: bash
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: test "$(go env GOOS)/$(go env GOARCH)" = "$EXPECTED_TARGET"
      - name: Lint and test
        run: >-
          go run ./cmd/project quality
          --stage tools --stage version --stage format --stage modules
          --stage vet --stage lsp --stage lint --stage test
  commit-policy:
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
          set-safe-directory: false
      - uses: ./.github/actions/toolchain
      - name: Validate released commit messages
        shell: bash
        run: |
          set -euo pipefail
          previous="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' "$RELEASE_TAG^" 2>/dev/null || true)"
          if test -n "$previous"; then
            go run ./cmd/project commit-msg --commit-range "$previous..$RELEASE_TAG"
          fi
  build:
    needs: [lint-test, commit-policy]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: windows/amd64
            artifact: windows-amd64
          - os: ubuntu-24.04
            target: windows/arm64
            artifact: windows-arm64
            zig: true
          - os: ubuntu-24.04
            target: linux/amd64
            artifact: linux-amd64
          - os: ubuntu-24.04-arm
            target: linux/arm64
            artifact: linux-arm64
          - os: macos-15-intel
            target: darwin/amd64
            artifact: darwin-amd64
          - os: macos-15
            target: darwin/arm64
            artifact: darwin-arm64
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
          set-safe-directory: false
      - uses: ./.github/actions/toolchain
      - name: Setup Zig for Windows ARM64 cross-compilation
        if: matrix.zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
          use-cache: false
      - name: Verify native target
        if: "!matrix.zig"
        shell: bash
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: test "$(go env GOOS)/$(go env GOARCH)" = "$EXPECTED_TARGET"
      - name: Build and package allowlisted library
        if: "!matrix.zig"
        run: go run ./cmd/project package
      - name: Cross-compile and package Windows ARM64 library
        if: matrix.zig
        shell: bash
        env:
          CGO_ENABLED: "1"
          TARGET_GOOS: windows
          TARGET_GOARCH: arm64
          CC: zig cc -target aarch64-windows-gnu
          CXX: zig c++ -target aarch64-windows-gnu
        run: go run ./cmd/project package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cpa-workbuddy-${{ matrix.artifact }}
          path: |
            out/dist/*.zip
            out/dist/*.sha256
          if-no-files-found: error
          retention-days: 7
          overwrite: true
  publish:
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
          set-safe-directory: false
      - name: Validate version, tag, and release notes
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          test -n "$version"
          test "$TAG" = "v$version" || { echo "tag $TAG must equal v$version" >&2; exit 1; }
          notes_file=".github/release-notes/$TAG.md"
          test -s "$notes_file" || { echo "$notes_file is missing or empty" >&2; exit 1; }
          notes_title="$(head -n 1 "$notes_file" | tr -d '\r')"
          test "$notes_title" = "# $TAG" || { echo "$notes_file must start with '# $TAG'" >&2; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cpa-workbuddy-*
          path: artifacts
          merge-multiple: true
      - name: Verify exact artifact set and checksums
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          targets=(windows_amd64 windows_arm64 linux_amd64 linux_arm64 darwin_amd64 darwin_arm64)
          expected=""
          for target in "${targets[@]}"; do
            base="cpa-workbuddy_${version}_${target}.zip"
            expected="${expected}${base}"$'\n'
            expected="${expected}${base}.sha256"$'\n'
          done
          if find artifacts -mindepth 1 -maxdepth 1 -type d | grep -q .; then
            echo "unexpected directories in downloaded artifacts" >&2
            exit 1
          fi
          actual="$(find artifacts -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort)"
          if test "$actual" != "$(printf '%s' "$expected" | sort)"; then
            echo "downloaded artifacts do not match the six expected targets" >&2
            printf 'expected:\n%s\nactual:\n%s\n' "$(printf '%s' "$expected" | sort)" "$actual" >&2
            exit 1
          fi
          for target in "${targets[@]}"; do
            (cd artifacts && sha256sum --check --strict "cpa-workbuddy_${version}_${target}.zip.sha256")
          done
          : > artifacts/checksums.txt
          for target in "${targets[@]}"; do
            cat "artifacts/cpa-workbuddy_${version}_${target}.zip.sha256" >> artifacts/checksums.txt
          done
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          assets=()
          for target in windows_amd64 windows_arm64 linux_amd64 linux_arm64 darwin_amd64 darwin_arm64; do
            base="cpa-workbuddy_${version}_${target}.zip"
            assets+=("artifacts/$base")
          done
          gh release create "$TAG" \
            --repo "$REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --notes-file ".github/release-notes/$TAG.md" \
            artifacts/checksums.txt "${assets[@]}"
